# nginx（另一台主機）：https://api.neonshift.cc → l1.neonshift.cc:6080
# 憑證由 certbot／既有機制管理；只保留反代與健康檢查相關設定。
upstream neonshift_api {
    server l1.neonshift.cc:6080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name api.neonshift.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.neonshift.cc;

    # ssl_certificate     /etc/letsencrypt/live/api.neonshift.cc/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.neonshift.cc/privkey.pem;

    client_max_body_size 64k;

    location = /healthz {
        proxy_pass http://neonshift_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        proxy_pass http://neonshift_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
