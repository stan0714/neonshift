# nginx（另一台主機）：https://api.neonshift.cc → l1／l2 :6080（2026-09-22 起兩台並列；只導 l2 時把 l1 那行拿掉）
# 憑證由 certbot／既有機制管理；只保留反代與健康檢查相關設定。
# 2026-09-22 實測教訓：upstream 用主機名時 nginx 只在啟動時解析一次，且可能解析到沒開放的位址；
# 一個連不到的節點會讓每個請求先撞 proxy_connect_timeout（預設 60 s）再換下一台 → 公網延遲 10～30 s、Cloudflare 520。
# 因此：節點寫 IP、connect timeout 縮短、失敗自動換台、加上 upstream 時間紀錄方便對照。
upstream neonshift_api {
    server 104.105.136.214:6080 max_fails=2 fail_timeout=10s;   # l1.neonshift.cc
    server 104.105.147.98:6080  max_fails=2 fail_timeout=10s;   # l2.neonshift.cc
    keepalive 16;
}

log_format neonshift_upstream '$remote_addr [$time_local] "$request" $status '
                              'rt=$request_time ua=$upstream_addr ust=$upstream_status urt=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name api.neonshift.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.neonshift.cc;

    # ssl_certificate     /etc/letsencrypt/live/api.neonshift.cc/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.neonshift.cc/privkey.pem;

    access_log /var/log/nginx/api.neonshift.cc.access.log neonshift_upstream;
    error_log  /var/log/nginx/api.neonshift.cc.error.log warn;

    client_max_body_size 64k;

    # 連不上就 3 秒內換下一台；讀取仍給後端 30 s（打卡驗證／鏈上查詢）
    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location = /healthz {
        proxy_pass http://neonshift_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        proxy_pass http://neonshift_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
