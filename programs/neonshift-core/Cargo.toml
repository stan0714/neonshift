[package]
name = "neonshift-core"
version = "0.1.0"
description = "NeonShift 鏈上程式：Config、PlayerProfile、clock_in、跑鞋與錦標賽（SD 3）"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "neonshift_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", features = ["token", "associated_token"] }
# canonical bytes 與後端逐 byte 一致的唯一來源（PG-C-04 / PG-B-10）
attestation-core = { path = "../attestation-core" }
solana-instructions-sysvar = "3"
solana-sdk-ids = "3"

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-ed25519-program = "3.0.0"
ed25519-dalek = "2.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
