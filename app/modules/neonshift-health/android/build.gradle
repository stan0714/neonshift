plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.neonshifthealth'
version = '0.1.0'

android {
  namespace "expo.modules.neonshifthealth"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Health Connect Jetpack SDK（SD 2.2）；Android 14+ 內建 provider，不需額外安裝
  implementation "androidx.health.connect:connect-client:1.1.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
