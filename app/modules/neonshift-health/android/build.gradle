plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.neonshifthealth'
version = '0.1.0'

android {
  namespace "expo.modules.neonshifthealth"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Health Connect Jetpack SDK（SD 2.2）；Android 14+ 內建 provider，不需額外安裝
  implementation "androidx.health.connect:connect-client:1.1.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
  // 權限 contract 的 Intent 常數（RequestMultiplePermissions）與 RN PermissionAwareActivity
  implementation "androidx.activity:activity-ktx:1.9.3"
  implementation "com.facebook.react:react-android"
  // PG-A-19 背景同步
  implementation "androidx.work:work-runtime-ktx:2.10.0"
}
